services:
  superlink:
    image: flwr/superlink:1.34.0
    # NOTE: all five ports are published to the host, which is correct for a
    # single-machine development topology and WRONG for a multi-unit deployment.
    # There, only 9092 (SuperNode -> SuperLink) may be reachable from client
    # units and 9093 (deployment API) only from the management network. See
    # env/incus/PORTS.md before deploying beyond one host.
    #
    # This compose file also runs --insecure. TLS material for turning that off
    # is generated by: podman compose -f env/podman/certs.yml run --rm gen-certs
    command: >-
      --insecure 
      --isolation process
    ports:
      - "9091:9091"
      - "9092:9092"
      - "9093:9093"
    networks:
      - flwr-network

  supernode-1:
    image: flwr/supernode:1.34.0
    # partiton-id/num-partitions are delivered here, which is why the ClientApp
    # reads them from node_config and refuses to guess when they are absent.
    command: >-
      --superlink superlink:9092
      --insecure
      --node-config "partition-id=0 num-partitions=2"
      --isolation process
    ports:
      - "9094:9094"
    depends_on:
      - superlink
    networks:
      - flwr-network

  supernode-2:
    image: flwr/supernode:1.34.0
    command: >-
      --superlink superlink:9092
      --insecure
      --node-config "partition-id=1 num-partitions=2"
      --isolation process
    ports:
      - "9095:9095"
    depends_on:
      - superlink
    networks:
      - flwr-network

  superexec-serverapp:
    build:
      context: .
      dockerfile: Containerfile.superexec
    image: pyhealth-flower-superexec:0.1.0
    command: >-
      --insecure
      --plugin-type serverapp
      --appio-api-address superlink:9091
    depends_on:
      - superlink
    networks:
      - flwr-network

  superexec-clientapp-1:
    image: pyhealth-flower-superexec:0.1.0
    command: >-
      --insecure
      --plugin-type clientapp
      --appio-api-address supernode-1:9094
    depends_on:
      - supernode-1
      - superexec-serverapp
    networks:
      - flwr-network

  superexec-clientapp-2:
    image: pyhealth-flower-superexec:0.1.0
    command: >-
      --insecure
      --plugin-type clientapp
      --appio-api-address supernode-2:9095
    depends_on:
      - supernode-2
      - superexec-serverapp
    networks:
      - flwr-network

networks:
  flwr-network:
    driver: bridge
