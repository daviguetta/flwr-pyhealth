# Component `comunicacao` — the TRANSPORT half of the three-level arm.
#
# It is the only component of this arm that declares a horizontal dependency:
# `node -> link.fleet`. Both ends are units of this same component, so R3/C002
# holds and the platform injects the SuperLink endpoint (application-VPN address
# + published port) into `node`. That injection — not the nesting — is what lets
# a SuperNode reach a SuperLink sitting on another host.
#
# `appio` is declared as a service, and that declaration is the arm's COST, not
# an oversight. It is what puts the nested unit's `ServiceEndpoint` into the
# parent's `UnitPlan.children`, which is the only way a parent unit can learn the
# address of the child it hosts (see `../images/supervise-exec.sh`). The platform
# has no parent-scoped publication, so declaring it also publishes it on the
# application VPN. `docs/HPC_SHELF_ROADMAP.md`, Phase 3 (reopened 2026-10-03),
# records the reasoning; `../validate.py` reproduces the measurement offline and
# reports it next to the grouped arm, which pays nothing.
#
# `control` (9093) is deliberately NOT declared. The Control API is the
# `flwr run` entry point and belongs to the management-network decision in
# Phase 6. Leaving it undeclared keeps the exposed surface exactly
# `appio` + `fleet`, which is what makes the comparison measurable.
apiVersion: hpcshelf.org/v1
kind: Component

metadata:
  name: comunicacao
  version: "0.1"

spec:
  units:
    link:
      image: catalog.hpcshelf.org/pyhealth/flower-link:0.1.0

      replicas:
        min: 1
        max: 1
        default: 1

      application:
        command:
          - /opt/hpcshelf/supervise-link.sh

      services:
        # The Runtime API the SuperExec in the parent unit dials. The owning unit
        # is told its own container port; the parent derives the address from its
        # own unit plan.
        appio:
          protocol: grpc
          containerPort: 9091
          environment:
            port: FL_APPIO_PORT

        # The only interface that crosses an institution boundary.
        fleet:
          protocol: grpc
          containerPort: 9092
          environment:
            port: FL_FLEET_PORT

    node:
      image: catalog.hpcshelf.org/pyhealth/flower-node:0.1.0

      replicas:
        min: 1
        max: 8
        default: 2

      application:
        command:
          - /opt/hpcshelf/supervise-node.sh
        environment:
          # A cardinality: identical across replicas, so a shared binding is
          # correct for it. It must equal the number of nodes and the app's
          # `num-partitions`; `../validate.py` refuses drift instead of warning.
          PYHEALTH_NUM_PARTITIONS: "2"

      services:
        appio:
          protocol: grpc
          containerPort: 9094
          environment:
            port: FL_APPIO_PORT

      dependencies:
        link:
          target:
            unit: link
            service: fleet
          environment:
            host: FL_SUPERLINK_HOST
            port: FL_SUPERLINK_PORT
