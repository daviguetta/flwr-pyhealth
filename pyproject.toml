[project]
name = "pyhealth-federated-learning"
version = "0.1.0"
description = "Federated learning reference framework for early warning of clinical deterioration, built on Flower and PyHealth."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
	# "simulation" pulls Ray, which Flower's Simulation Runtime requires; without
	# it `flwr run` cannot start a local SuperLink.
	# "dp" pulls dp-accounting, used to report a privacy budget per experiment.
	"flwr[simulation,dp]>=1.34.0",
	"numpy>=2.0.0",
	"pyhealth>=2.0.0",
	"torch>=2.0.0",
]

[dependency-groups]
dev = [
	"pytest>=8.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flower_app*", "libs*"]

[tool.flwr.app]
publisher = "local-study"

[tool.flwr.app.components]
serverapp = "flower_app.server_app:app"
clientapp = "flower_app.client_app:app"

[tool.flwr.app.config]
# --- federation shape -------------------------------------------------------
num-partitions = 2
fraction-train = 1.0
fraction-evaluate = 1.0
# "uniform" keeps the IID baseline; "label-skew" builds a deliberately
# pathological non-IID split to exercise FedProx.
partition-scheme = "uniform"

# --- aggregation strategy ---------------------------------------------------
# "fedavg" (McMahan et al., 2017) or "fedprox" (Li et al., 2018).
strategy = "fedavg"
proximal-mu = 0.0

# --- local optimisation -----------------------------------------------------
num-server-rounds = 3
local-epochs = 2
learning-rate = 0.00001
batch-size = 32

# --- differential privacy (architectural requirement) ----------------------
# Disabled by default: enabling DP changes the numbers, so the privacy budget
# must be a deliberate, recorded choice rather than a silent default.
# Modes: none | server-fixed-clipping | server-adaptive-clipping
#      | client-fixed-clipping | client-adaptive-clipping
dp-mode = "none"
dp-noise-multiplier = 0.0
dp-clipping-norm = 1.0

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
	"slow: end-to-end tests that load the full MIMIC-IV demo dataset",
]

[tool.ruff]
line-length = 100
target-version = "py313"
